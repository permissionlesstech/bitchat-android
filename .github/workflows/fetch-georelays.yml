name: Fetch GeoRelays Data

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

env:
  SETUP_JAVA_VERSION: 21.0.11+10.0.LTS

permissions:
  contents: write

jobs:
  update-relay-data:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up pinned JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.SETUP_JAVA_VERSION }}

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Fetch GeoRelays
        # Must match RelayDirectory.ASSET_FILE_URL. This job refreshes the
        # bundled asset from the app's runtime source.
        run: |
          candidate=$(mktemp)
          trap 'rm -f "$candidate"' EXIT
          wget -O "$candidate" https://raw.githubusercontent.com/permissionlesstech/bitchat/refs/heads/main/relays/online_relays_gps.csv
          ./gradlew :app:testDebugUnitTest --tests '*RelayDirectoryAssetUpdateTest' \
            -PrelayDirectoryCandidate="$candidate"
          mv "$candidate" ./app/src/main/assets/nostr_relays.csv

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT
    
      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add app/src/main/assets/nostr_relays.csv
          git commit -m "Automated update of relay data - $(date -u)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
